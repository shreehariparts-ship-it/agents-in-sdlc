<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#052e2b;color:#d1fae5}
  .card{background:#064e3b;padding:40px;border-radius:16px;width:min(90vw,420px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  input{font-size:16px;padding:12px;border-radius:8px;border:0;width:80%;margin-bottom:16px}
  button{font-size:16px;padding:12px 24px;border:0;border-radius:8px;background:#10b981;color:#03271f;font-weight:700;cursor:pointer}
  #out{margin-top:20px;font-size:20px;font-weight:700;min-height:28px;color:#6ee7b7}
</style></head><body>
<div class="card">
  <h1>📝 Form Test</h1>
  <input id="name" placeholder="Naam likho">
  <br><button id="go" onclick="greet()">Submit</button>
  <div id="out"></div>
</div>
<script>
  function greet(){const v=document.getElementById('name').value.trim();
    document.getElementById('out').textContent=v?('👋 Hello, '+v+'!'):'⚠️ Naam khali hai';}
</script></body></html>
